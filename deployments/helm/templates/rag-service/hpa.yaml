{{- if and .Values.ragService.enabled .Values.ragService.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "cb-platform.fullname" . }}-rag
  labels:
    {{- include "cb-platform.componentLabels" (dict "ctx" . "component" "rag") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "cb-platform.fullname" . }}-rag
  minReplicas: {{ .Values.ragService.hpa.minReplicas }}
  maxReplicas: {{ .Values.ragService.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.ragService.hpa.targetCPUUtilization }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
{{- end }}
