{{- if .Values.networkPolicy.enabled }}
{{- range $component, $cfg := dict "gateway" .Values.gateway "ai" .Values.aiService "rag" .Values.ragService }}
{{- if $cfg.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cb-platform.fullname" $ }}-{{ $component }}
  labels:
    {{- include "cb-platform.componentLabels" (dict "ctx" $ "component" $component) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cb-platform.selectorLabels" (dict "ctx" $ "component" $component) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 同 namespace 内 Pod 互相访问
    - from:
        - podSelector: {}
    # Ingress Controller 流量(仅 gateway)
    {{- if eq $component "gateway" }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
    {{- end }}
  egress:
    # DNS 解析
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 同 namespace 内服务互相访问
    - to:
        - podSelector: {}
    # 外部 API(LLM/Embedding)出站
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
{{- end }}
{{- end }}
{{- end }}
