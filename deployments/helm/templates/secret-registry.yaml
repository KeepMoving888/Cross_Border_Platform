{{- if .Values.image.pullSecrets }}
{{- range $secret := .Values.image.pullSecrets }}
{{- if not (lookup "v1" "Secret" $.Release.Namespace $secret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  labels:
    {{- include "cb-platform.labels" $ | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install"
    "helm.sh/hook-delete-policy": "before-hook-creation"
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"ghcr.io\":{\"auth\":\"%s\"}}}" (printf "%s:%s" "username" "password" | b64enc) | b64enc }}
{{- end }}
{{- end }}
{{- end }}
